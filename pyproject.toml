[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "RobustDocOCR"
version = "1.0.2"
description = "A robust preprocessing pipeline for document OCR that significantly improves Tesseract accuracy on mobile-captured ID documents"
authors = [
    {name = "Ahmed Mohamed", email = "3bsalam0@gmail.com"}
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
dependencies = [
    "opencv-python-headless>=4.5.0",
    "numpy>=1.20.0",
    "pillow>=9.0.0",
    "matplotlib>=3.5.0",
]
keywords = [
    "ocr",
    "document",
    "preprocessing",
    "image-processing",
    "tesseract",
    "computer-vision",
    "document-analysis",
    "text-recognition",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

[project.urls]
Homepage = "https://github.com/3bsalam-1/RobustDocOCR"
Documentation = "https://github.com/3bsalam-1/RobustDocOCR/blob/main/docs"
Repository = "https://github.com/3bsalam-1/RobustDocOCR"
Issues = "https://github.com/3bsalam-1/RobustDocOCR/issues"
Changelog = "https://github.com/3bsalam-1/RobustDocOCR/blob/main/CHANGELOG.md"

[project.scripts]
robustdococr = "robustdococr.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "isort>=5.0.0",
    "mypy>=0.900",
    "twine>=4.0.0",
    "build>=0.8.0"
]
ocr = [
    "pytesseract>=0.3.0"
]
all = [
    "RobustDocOCR[dev,ocr]"
]

[tool.setuptools.packages.find]
where = ["."]
exclude = ["src*", "tests*", "examples*", "notebooks*", "scripts*", "docs*"]

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
python_classes = "Test*"
addopts = "--cov=src --cov-report=term-missing --cov-report=html --verbose"